name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['24.22.1', '26.12.1']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install development tools
        run: npm ci
      - name: Validate source
        run: npm run check
      - name: Verify generated assets
        run: |
          npm run build
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Validate deployment package
        run: |
          npm run package
          node scripts/check-site.js dist
      - name: Create itch.io distributable
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.node == '24.22.1'
        working-directory: dist
        run: zip -9 -r "${RUNNER_TEMP}/you-only-get-1s.zip" .
      - name: Upload itch.io distributable
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && matrix.node == '24.22.1'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: itch-io-distributable
          path: ${{ runner.temp }}/you-only-get-1s.zip
          retention-days: 14
          if-no-files-found: error
