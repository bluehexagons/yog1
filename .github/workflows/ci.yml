name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate source
        run: npm run check
      - name: Verify generated assets
        run: |
          npm run build
          git diff --exit-code
      - name: Validate deployment package
        run: |
          npm run package
          node scripts/check-site.js dist
      - name: Create itch.io distributable
        working-directory: dist
        run: zip -9 -r "${RUNNER_TEMP}/you-only-get-1s.zip" .
      - name: Upload itch.io distributable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: itch-io-distributable
          path: ${{ runner.temp }}/you-only-get-1s.zip
          retention-days: 14
          if-no-files-found: error
